<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سعر السوق المباشر</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .price-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 360px;
            text-align: center;
            border-top: 4px solid #27ae60;
        }
        .card-title {
            font-size: 16px;
            color: #555;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .price-text {
            font-size: 16px;
            color: #2c3e50;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            line-height: 1.6;
            white-space: pre-wrap;
            text-align: right;
            max-height: 160px;
            overflow-y: auto;
        }
        .time-box {
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="price-card">
        <div class="card-title">📈 سعر السوق اللحظي</div>
        <div class="price-text" id="lastMessage">جاري تحديث الأسعار...</div>
        <div class="time-box" id="messageTime">الوقت: --</div>
    </div>

    <script>
        async function fetchTelegramData() {
            try {
                // استخدام خدمة rss2json الموثوقة لقراءة قناة التليغرام كبيانات منظمة
                const channelName = "dollariraqi";
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Ft.me%2Fs%2F${channelName}`;

                let response = await fetch(apiUrl);
                let data = await response.json();

                if (data.status === 'ok' && data.items && data.items.length > 0) {
                    let latestPost = data.items[0];
                    let rawText = latestPost.description || latestPost.title;
                    let pubDate = new Date(latestPost.pubDate);

                    // تنظيف النص من وسوم الـ HTML الزائدة
                    let cleanText = rawText.replace(/<[^>]*>?/gm, '');

                    // عرض النص في الموقع
                    document.getElementById('lastMessage').innerText = cleanText;

                    // عرض الوقت بشكل مرتب
                    let timeString = pubDate.toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' });
                    let dateString = pubDate.toLocaleDateString('ar-IQ');
                    document.getElementById('messageTime').innerText = `آخر تحديث: ${dateString} - ${timeString}`;
                } else {
                    document.getElementById('lastMessage').innerText = "تعذر جلب الرسائل حالياً.";
                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('lastMessage').innerText = "حدث خطأ أثناء جلب البيانات.";
            }
        }

        // تشغيل الدالة فور فتح الصفحة
        fetchTelegramData();

        // تحديث البيانات تلقائياً كل دقيقة
        setInterval(fetchTelegramData, 60000);
    </script>

</body>
</html>
